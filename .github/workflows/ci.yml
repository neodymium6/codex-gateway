name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  e2e-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: password
            locale: zh
            specs: ci-smoke.spec.ts i18n.spec.ts external-runtime.spec.ts deployment-regressions.spec.ts
          - mode: trusted-network
            locale: en
            specs: trusted-network.spec.ts notification-controls.spec.ts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # Dependencies, Nuxt production build and Playwright all run inside Docker.
      # These selected tests make no model turns and require no API secrets.
      - name: Run credential-free Docker E2E
        env:
          # Never copy the runner's Codex credentials into the SSH test targets.
          E2E_CODEX_HOME: ${{ runner.temp }}/codex-e2e-empty
          E2E_GATEWAY_AUTH_MODE: ${{ matrix.mode }}
          E2E_DEFAULT_LOCALE: ${{ matrix.locale }}
          E2E_SPECS: ${{ matrix.specs }}
        run: |
          mkdir -p "$E2E_CODEX_HOME"
          tests/e2e/run-in-containers.sh $E2E_SPECS --project=chromium

  nonroot-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build with restrictive source permissions
        run: |
          chmod 600 public/favicon.ico public/site.webmanifest scripts/create-user.mjs
          docker build -t gateway-nonroot-test .
      - name: Read packaged assets as the production UID
        run: |
          docker run --rm --user 1000:1000 --read-only --entrypoint node gateway-nonroot-test \
            -e 'const fs=require("node:fs"); for (const path of ["/app/.output/public/favicon.ico", "/app/.output/public/site.webmanifest", "/app/scripts/create-user.mjs"]) fs.readFileSync(path);'
      - name: Check production HTTP assets and fail-closed missing user
        run: |
          container=$(docker run -d --user 1000:1000 --read-only \
            --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp \
            -p 127.0.0.1:3000:3000 \
            -e CODEX_GATEWAY_CONFIG_SECRET=ci-only-encryption-key \
            -e CODEX_GATEWAY_DB_PATH=/data/gateway.db \
            -e CODEX_GATEWAY_AUTH_MODE=trusted-network \
            -e CODEX_GATEWAY_TRUSTED_USER=missing \
            -e CODEX_GATEWAY_TRUSTED_ORIGINS=http://127.0.0.1:3000 \
            gateway-nonroot-test)
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs "$container"; fi; docker stop "$container" >/dev/null; docker rm "$container" >/dev/null' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:3000/site.webmanifest
          curl --fail --output /dev/null http://127.0.0.1:3000/favicon.ico
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:3000' http://127.0.0.1:3000/api/auth/bootstrap)" = 403

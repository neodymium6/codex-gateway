name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  e2e-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # Dependencies, Nuxt production build and Playwright all run inside Docker.
      # These selected tests make no model turns and require no API secrets.
      - name: Run credential-free Docker E2E
        env:
          # Never copy the runner's Codex credentials into the SSH test targets.
          E2E_CODEX_HOME: ${{ runner.temp }}/codex-e2e-empty
        run: |
          mkdir -p "$E2E_CODEX_HOME"
          tests/e2e/run-in-containers.sh ci-smoke.spec.ts i18n.spec.ts --project=chromium
